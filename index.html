<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7C1D1D" />
    <title>StudyCommons — School Lesson Q&A & Idea Sharing</title>
    <meta
      name="description"
      content="A collaborative school platform for students and teachers to ask questions about lessons, share study ideas, and build shared class understanding."
    />
    <meta property="og:title" content="StudyCommons — School Lesson Q&A & Idea Sharing" />
    <meta
      property="og:description"
      content="A collaborative school platform for students and teachers to ask questions about lessons, share study ideas, and build shared class understanding."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var raw = localStorage.getItem('studycommons_theme_v2');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.colorMode === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[var(--theme-canvas)] text-[#1C1917] dark:text-[#F7F3EA] antialiased selection:bg-[var(--theme-accent-soft)] selection:text-[var(--theme-accent-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
